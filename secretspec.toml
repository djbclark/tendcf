[project]
name = "tendcf"
revision = "1.0"

# Declarations only — values live in ./.env (dotenv provider), never in git.
# https://secretspec.dev

[profiles.default]
ATLASSIAN_CFENGINE_API_TOKEN = { description = "Atlassian API token for northerntech.atlassian.net (CFEngine's public Jira, project CFE), used to file and update tickets for the upstream CFEngine/libntech PRs. Mint at https://id.atlassian.com/manage-profile/security/api-tokens — the account is a Google SSO login, which has no password, so a token is the only way to authenticate. Pairs with ATLASSIAN_CFENGINE_EMAIL as HTTP basic auth 'email:token'.", required = true }
ATLASSIAN_CFENGINE_EMAIL = { description = "Email address of the Atlassian account the API token belongs to. Not secret, but basic auth needs both halves and a mismatch just returns 401, so it is declared alongside the token rather than guessed.", required = true }
